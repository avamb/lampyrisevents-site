# Site stack: one nginx container with the built static site.
# Only public values here. Domain routing and every secret live in the deploy environment, not in this repository.
#   docker compose up --build -d web
services:
  web:
    build:
      context: .
      target: web
      args:
        SITE_URL: ${SITE_URL:-https://new.lampyrisevents.com}
        SITE_INDEXING: ${SITE_INDEXING:-false}
        PUBLIC_ARENA_API: ${PUBLIC_ARENA_API:-https://api.arenasoldout.com}
        PUBLIC_FEED_TOKEN: ${PUBLIC_FEED_TOKEN:-}
        PUBLIC_META_PIXEL_ID: ${PUBLIC_META_PIXEL_ID:-}
        PUBLIC_GA4_ID: ${PUBLIC_GA4_ID:-}
        PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
        DATA_SOURCE: ${DATA_SOURCE:-fixture}
        EMBEDDED_PAYMENT: ${EMBEDDED_PAYMENT:-}
        PUBLIC_ARENA_WIDGET_URL: ${PUBLIC_ARENA_WIDGET_URL:-https://tickets.arenasoldout.com/widget/v1/arena-tickets.js}
        PUBLIC_ARENA_WIDGET_API: ${PUBLIC_ARENA_WIDGET_API:-${PUBLIC_ARENA_API:-https://api.arenasoldout.com}}
    environment:
      ARENA_API_ORIGIN: ${PUBLIC_ARENA_API:-https://api.arenasoldout.com}
      SITE_INDEXING: ${SITE_INDEXING:-false}
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    networks:
      - default
      - dokploy-network

# The server's Traefik reaches the container by name over this shared network (file-provider route of the domain switch).
networks:
  dokploy-network:
    external: true
